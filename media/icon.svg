<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img"
    aria-label="Git Killer">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#223049" />
            <stop offset="0.5" stop-color="#111A2A" />
            <stop offset="1" stop-color="#070A10" />
        </linearGradient>

        <linearGradient id="main" gradientUnits="userSpaceOnUse" x1="168" y1="118" x2="168" y2="398">
            <stop offset="0" stop-color="#8AD5FF" />
            <stop offset="0.55" stop-color="#4F9CF9" />
            <stop offset="1" stop-color="#2F6FE4" />
        </linearGradient>

        <linearGradient id="branch" gradientUnits="userSpaceOnUse" x1="168" y1="208" x2="344" y2="398">
            <stop offset="0" stop-color="#D2C2FF" />
            <stop offset="0.55" stop-color="#A78BFA" />
            <stop offset="1" stop-color="#7C5CFF" />
        </linearGradient>

        <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#4F9CF9" stop-opacity="0.22" />
            <stop offset="1" stop-color="#4F9CF9" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18" />
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09" />
            <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.02" />
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
        </linearGradient>
    </defs>

    <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)" />
    <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#glowBlue)" />
    <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#glowPurple)" />
    <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#sheen)" />

    <!-- soft lane halos -->
    <path d="M168 118V398" fill="none" stroke="#4F9CF9" stroke-width="52" stroke-linecap="round" opacity="0.14" />
    <path d="M168 208C168 268 344 240 344 300V398" fill="none" stroke="#8B5CF6" stroke-width="52" stroke-linecap="round"
        opacity="0.14" />

    <!-- graph lanes -->
    <path d="M168 118V398" fill="none" stroke="url(#main)" stroke-width="34" stroke-linecap="round" />
    <path d="M168 208C168 268 344 240 344 300V398" fill="none" stroke="url(#branch)" stroke-width="34"
        stroke-linecap="round" />

    <!-- lane highlights -->
    <path d="M164 128V388" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.18" />
    <path d="M162 214C162 264 338 234 338 300V390" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"
        opacity="0.16" />

    <!-- HEAD halo -->
    <circle cx="168" cy="156" r="59" fill="none" stroke="#9ADBFF" stroke-width="5" stroke-dasharray="10 12"
        opacity="0.6" />

    <!-- commit nodes -->
    <g>
        <circle cx="168" cy="156" r="41" fill="#0A101A" stroke="url(#main)" stroke-width="13" />
        <circle cx="168" cy="156" r="16" fill="#D6F1FF" />
        <circle cx="156" cy="144" r="5" fill="#FFFFFF" opacity="0.95" />
    </g>
    <g>
        <circle cx="168" cy="398" r="41" fill="#0A101A" stroke="url(#main)" stroke-width="13" />
        <circle cx="168" cy="398" r="16" fill="#D6F1FF" />
        <circle cx="156" cy="386" r="5" fill="#FFFFFF" opacity="0.95" />
    </g>
    <g>
        <circle cx="344" cy="300" r="41" fill="#0A101A" stroke="url(#branch)" stroke-width="13" />
        <circle cx="344" cy="300" r="16" fill="#EEE7FF" />
        <circle cx="332" cy="288" r="5" fill="#FFFFFF" opacity="0.95" />
    </g>
    <g>
        <circle cx="344" cy="398" r="41" fill="#0A101A" stroke="url(#branch)" stroke-width="13" />
        <circle cx="344" cy="398" r="16" fill="#EEE7FF" />
        <circle cx="332" cy="386" r="5" fill="#FFFFFF" opacity="0.95" />
    </g>

    <!-- inner rim -->
    <rect x="17.5" y="17.5" width="477" height="477" rx="102.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"
        stroke-width="3" />
</svg>